<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="bow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#A0522D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)"/>
  
  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="80" r="1" fill="#fff" opacity="0.5">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="60" r="1" fill="#fff" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Trajectory Arc -->
  <path d="M80,180 Q250,80 400,120 Q550,160 680,180" 
        fill="none" stroke="url(#arc)" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Target -->
  <g transform="translate(680, 180)">
    <circle r="25" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <circle r="20" fill="#ff4444"/>
    <circle r="15" fill="#fff"/>
    <circle r="10" fill="#ff4444"/>
    <circle r="5" fill="#fff"/>
    <circle r="2" fill="#ffd700"/>
    
    <animateTransform attributeName="transform" type="scale" 
                      values="1;1.1;1" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Bow -->
  <g transform="translate(80, 180)">
    <!-- Bow string -->
    <line x1="-10" y1="-40" x2="-10" y2="40" stroke="#ddd" stroke-width="2">
      <animate attributeName="x1" values="-10;-20;-10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-10;-20;-10" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <!-- Bow body -->
    <path d="M-10,40 Q0,20 0,0 Q0,-20 -10,-40" 
          fill="none" stroke="url(#bow)" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.2;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Arrow on bow -->
  <g transform="translate(80, 180)">
    <g opacity="1">
      <line x1="0" y1="0" x2="-40" y2="0" stroke="#8B4513" stroke-width="2"/>
      <polygon points="-40,0 -35,2 -35,-2" fill="#666"/>
      <polygon points="2,-2 -5,-2 -2,0 -5,2 2,2 4,0" fill="#dc143c"/>
      
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;-15,0;0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Flying arrow -->
  <g opacity="0">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#8B4513" stroke-width="2"/>
    <polygon points="40,0 35,2 35,-2" fill="#666"/>
    <polygon points="-2,-2 5,-2 2,0 5,2 -2,2 -4,0" fill="#dc143c"/>
    
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="2s">
      <mpath href="path('M80,180 Q250,80 400,120 Q550,160 680,180')"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="2s"/>
  </g>

  <!-- Hit particles -->
  <g transform="translate(680, 180)">
    <circle r="2" fill="#ffd700" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="3.2s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;-15,-15" dur="0.5s" repeatCount="indefinite" begin="3.2s"/>
    </circle>
    <circle r="2" fill="#ffd700" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="3.3s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;15,-15" dur="0.5s" repeatCount="indefinite" begin="3.3s"/>
    </circle>
    <circle r="2" fill="#ffd700" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="3.4s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;-15,15" dur="0.5s" repeatCount="indefinite" begin="3.4s"/>
    </circle>
    <circle r="2" fill="#ffd700" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite" begin="3.5s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;15,15" dur="0.5s" repeatCount="indefinite" begin="3.5s"/>
    </circle>
  </g>

  <!-- Success text -->
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="32" 
        font-weight="bold" fill="#ffd700" opacity="0">
    🎯 BULLSEYE! 🎯
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite" begin="3.5s"/>
  </text>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" 
        font-weight="bold" fill="#ffd700">
    🏹 Arrow Shooting Game 🏹
  </text>

  <!-- Subtitle -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial" font-size="14" 
        fill="#aaa">
    Animated SVG Demo • GitHub Profile Ready
  </text>
</svg>
