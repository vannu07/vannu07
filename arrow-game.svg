<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ArcGradient">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="BowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88ce02"/>
      <stop offset="100%" stop-color="#66aa00"/>
    </linearGradient>
    
    <radialGradient id="TargetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow definition -->
    <g id="arrow">
      <line x2="60" fill="none" stroke="#888" stroke-width="2"/>
      <polygon fill="#888" points="64 0 58 2 56 0 58 -2"/>
      <polygon fill="#88ce02" points="2 -3 -4 -3 -1 0 -4 3 2 3 5 0"/>
    </g>
    
    <!-- Particle effect -->
    <circle id="particle" r="2" fill="#ffcc00" opacity="0.8"/>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="#222"/>
  
  <!-- Trajectory arc -->
  <path id="arc" fill="none" stroke="url(#ArcGradient)" stroke-width="4" 
        d="M100,250c200-300,500-300,750,0" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" 
                      values="1;1.1;1" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Target with glow effect -->
  <g id="target" transform="translate(900, 250)">
    <!-- Glow effect -->
    <circle r="40" fill="url(#TargetGlow)" opacity="0.5">
      <animate attributeName="r" values="35;45;35" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Target rings -->
    <circle r="30" fill="#FFF" stroke="#ddd" stroke-width="2"/>
    <circle r="22" fill="#F4531C"/>
    <circle r="15" fill="#FFF"/>
    <circle r="8" fill="#F4531C"/>
    <circle r="3" fill="#FFF"/>
    
    <!-- Target pulse animation -->
    <animateTransform attributeName="transform" type="scale" 
                      values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Bow -->
  <g id="bow" transform="translate(100, 250)" fill="none" stroke-linecap="round">
    <!-- Bow string -->
    <polyline fill="none" stroke="#ddd" stroke-width="2" points="-12,-50 -12,0 -12,50">
      <animate attributeName="points" 
               values="-12,-50 -12,0 -12,50;-25,-50 -25,0 -25,50;-12,-50 -12,0 -12,50" 
               dur="3s" repeatCount="indefinite"/>
    </polyline>
    
    <!-- Bow body -->
    <path fill="none" stroke="url(#BowGradient)" stroke-width="4" stroke-linecap="round" 
          d="M-12,50 c0-10,12-25,12-50s-12-40,-12-50">
      <animateTransform attributeName="transform" type="scale" 
                        values="1;1.1;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Arrow on bow (initial position) -->
  <g id="bow-arrow" transform="translate(100, 250)" opacity="1">
    <use href="#arrow" transform="scale(-1,1)">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;-20,0;0,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="3s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Flying arrow -->
  <g id="flying-arrow" opacity="0">
    <use href="#arrow"/>
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="2.5s">
      <mpath href="#arc"/>
    </animateMotion>
    <animateTransform attributeName="transform" type="rotate" 
                      values="0;-10;-5" dur="1.5s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="2.5s"/>
  </g>

  <!-- Hit particles -->
  <g id="particles" transform="translate(900, 250)">
    <use href="#particle" transform="translate(-10, -10)">
      <animate attributeName="opacity" values="0;0;1;0;0" dur="3s" repeatCount="indefinite" begin="3.8s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="-10,-10;-20,-20;-30,-30" dur="0.5s" repeatCount="indefinite" begin="3.8s"/>
    </use>
    <use href="#particle" transform="translate(10, -10)">
      <animate attributeName="opacity" values="0;0;1;0;0" dur="3s" repeatCount="indefinite" begin="3.9s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="10,-10;20,-20;30,-30" dur="0.5s" repeatCount="indefinite" begin="3.9s"/>
    </use>
    <use href="#particle" transform="translate(-10, 10)">
      <animate attributeName="opacity" values="0;0;1;0;0" dur="3s" repeatCount="indefinite" begin="4.0s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="-10,10;-20,20;-30,30" dur="0.5s" repeatCount="indefinite" begin="4.0s"/>
    </use>
    <use href="#particle" transform="translate(10, 10)">
      <animate attributeName="opacity" values="0;0;1;0;0" dur="3s" repeatCount="indefinite" begin="4.1s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="10,10;20,20;30,30" dur="0.5s" repeatCount="indefinite" begin="4.1s"/>
    </use>
  </g>

  <!-- Success text -->
  <g id="success-text" transform="translate(500, 150)" opacity="0" fill="#88ce02">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold">
      🎯 BULLSEYE! 🎯
      <animate attributeName="opacity" values="0;0;1;1;0" dur="3s" repeatCount="indefinite" begin="4s"/>
    </text>
    <animateTransform attributeName="transform" type="scale" 
                      values="0;1.2;1;1;0" dur="1s" repeatCount="indefinite" begin="4s"/>
  </g>

  <!-- Game title -->
  <text x="500" y="50" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="32" font-weight="bold" fill="#fff" opacity="0.8">
    🏹 Arrow Shooting Game 🏹
  </text>

  <!-- Instruction text -->
  <text x="500" y="380" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="#aaa" opacity="0.6">
    Animated SVG Demo - Click to view the interactive version!
  </text>

  <!-- Decorative elements -->
  <g id="stars" fill="#fff" opacity="0.3">
    <circle cx="150" cy="80" r="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="120" r="1.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="90" r="1">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="130" r="1.2">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wind effect lines -->
  <g id="wind" stroke="#444" stroke-width="1" opacity="0.2">
    <line x1="200" y1="100" x2="250" y2="105">
      <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;50,0;100,0" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="320" x2="350" y2="315">
      <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;50,0;100,0" dur="4s" repeatCount="indefinite" begin="1s"/>
    </line>
  </g>
</svg>
